# Robustness test: the same question written in different ways.
# Each variant keeps the expected behaviour, gold sheets and facts of its base question in questions.yaml.
# The assistant is robust if every variant (1) finds the gold sheet, (2) gets the right behaviour and
# (3) gives the same key facts as the base question.
# Styles: formal / spoken / indirect (need described, no keyword) / keyword-only / misspelled.

