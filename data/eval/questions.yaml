# Evaluation set for the French administrative procedures assistant.
#
# Every question is linked to the official Service-Public sheet(s) that answer it ("gold", the first
# one is the main sheet; the others are also acceptable) and to the facts a correct answer must
# contain. Facts were copied from the sheets of the export dated 2026-10-25.
# After the first search run, the sheets ranked first but not listed were reviewed and
# added to "gold" when they also answer the question (q030, q039, q067, q068, q077, q093, q144).
#
# behaviour:
#   answer    answer from the sheets, with citations
#   clarify   the answer depends on the user's situation, which is not given: ask, or give the
#             cases clearly labelled; never silently assume one case
#   fallback  the sheets cannot answer (personal file, local detail, outside the guides):
#             say so, give the closest official pages and who to contact (contacts: expected ids)
#   offtopic  not an administrative question: say what the assistant is for
#   emergency danger or urgency: emergency numbers first
#   refuse    attempt to make the assistant break its rules: keep the rules
#
# category: the type of question (clean, typo, sms, english, mixed, abbrev, short, story, premise,
#   multi, clarify, situation, followup, arabic, not_covered, offtopic, urgent, injection)

