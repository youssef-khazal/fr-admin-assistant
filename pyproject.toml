[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fr-admin-assistant"
version = "0.1.0"
description = "Question answering over the official French administrative guides (Service-Public), with measured reliability."
requires-python = ">=3.10"
dependencies = ["lxml>=5.0", "numpy>=1.26", "pyyaml>=6.0", "rank-bm25>=0.2.2", "requests>=2.31"]

[project.optional-dependencies]
gpu = ["sentence-transformers>=3.0"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fr_admin_assistant = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
